<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>FBC2026 Canon Visitor Registration</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192-v2.png">
  <link rel="apple-touch-icon" href="./icon-192-v2.png">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f6f6f8;
    }
    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f6f6f8;
    }
    #fallback {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 20;
      display: none;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 12px;
      font: 13px/1.45 Arial,sans-serif;
      box-shadow: 0 4px 20px rgba(0,0,0,.12);
    }
    #fallback a {
      display: inline-block;
      margin-top: 8px;
      color: #b40000;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <iframe
    id="app"
    title="FBC2026 Canon Visitor Registration"
    src="https://script.google.com/macros/s/AKfycbxZJK9vrgMsOn_bkPWKRE44ajWHSXTFdwvyW2l585AbyYitgXrPUEaZqxt3-8sqvJX52g/exec?embed=1&ek=PbsvAfkDnfDPRw_Nxgd75CDFGeYL7eCJ&v=119"
    allow="camera; clipboard-read; clipboard-write"
    referrerpolicy="no-referrer"
  ></iframe>

  <div id="fallback">
    画面を読み込めませんでした。通信を確認して再読み込みしてください。<br>
    <a href="/" onclick="window.location.reload(); return false;">再読み込み</a>
  </div>

  <script>
    let loaded = false;
    const frame = document.getElementById('app');
    const fallback = document.getElementById('fallback');
    frame.addEventListener('load', () => { loaded = true; });
    setTimeout(() => { if (!loaded) fallback.style.display = 'block'; }, 12000);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(registrations => Promise.all(registrations.map(registration => registration.unregister())))
        .catch(() => {});
    }
    if ('caches' in window) {
      caches.keys()
        .then(keys => Promise.all(keys.map(key => caches.delete(key))))
        .catch(() => {});
    }
  </script>
</body>
</html>
