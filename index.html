<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FBC2026 Canon">
  <title>FBC2026 Canon Visitor Registration</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    :root {
      /* Google Apps Script's warning bar height on mobile.
         The iframe is shifted upward by this amount so staff never sees it. */
      --gas-banner-crop: 170px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f6f6f8;
      font-family: Arial, "Noto Sans JP", sans-serif;
    }
    #shell {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #f6f6f8;
    }
    #app {
      position: absolute;
      left: 0;
      width: 100%;
      top: calc(-1 * var(--gas-banner-crop));
      height: calc(100% + var(--gas-banner-crop));
      border: 0;
      background: #f6f6f8;
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: #f6f6f8;
      transition: opacity .18s ease;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    .loading-card {
      text-align: center;
      font-weight: 700;
      color: #222;
    }
    .loading-card img {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      display: block;
      margin: 0 auto 14px;
    }
    .sub {
      margin-top: 7px;
      color: #777;
      font-size: 13px;
      font-weight: 400;
    }
    #fallback {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 20;
      display: none;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 12px;
      font-size: 13px;
      box-shadow: 0 4px 20px rgba(0,0,0,.12);
    }
    #fallback a {
      display: inline-block;
      margin-top: 8px;
      color: #b40000;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="shell">
    <iframe
      id="app"
      title="FBC2026 Canon Visitor Registration"
      src="https://script.google.com/macros/s/AKfycbxZJK9vrgMsOn_bkPWKRE44ajWHSXTFdwvyW2l585AbyYitgXrPUEaZqxt3-8sqvJX52g/exec?embed=1&ek=PbsvAfkDnfDPRw_Nxgd75CDFGeYL7eCJ"
      allow="camera; clipboard-read; clipboard-write"
      referrerpolicy="no-referrer"
    ></iframe>
  </div>

  <div id="loading">
    <div class="loading-card">
      <img src="./icon-192.png" alt="">
      FBC2026 Canon
      <div class="sub">Visitor Registration</div>
    </div>
  </div>

  <div id="fallback">
    画面を読み込めませんでした。通信を確認して再読み込みしてください。<br>
    <a href="https://script.google.com/macros/s/AKfycbxZJK9vrgMsOn_bkPWKRE44ajWHSXTFdwvyW2l585AbyYitgXrPUEaZqxt3-8sqvJX52g/exec" target="_blank" rel="noopener">直接開く（予備）</a>
  </div>

  <script>
    const frame = document.getElementById('app');
    const loading = document.getElementById('loading');
    const fallback = document.getElementById('fallback');

    frame.addEventListener('load', () => {
      setTimeout(() => loading.classList.add('hide'), 350);
    });

    setTimeout(() => {
      if (!loading.classList.contains('hide')) fallback.style.display = 'block';
    }, 12000);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
